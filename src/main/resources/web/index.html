<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TM Mission Control</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>TM Mission Control</h1>
      <p class="meta" id="meta">Waiting for Player.log…</p>
    </div>
    <div class="top-right">
      <div class="live" id="live" role="status">idle</div>
      <a class="qr-wrap" id="qr-link" href="/" title="Mission Control URL">
        <img class="qr" id="qr" src="/qr.svg" alt="QR code for this Mission Control URL">
        <span class="qr-url" id="qr-url"></span>
      </a>
    </div>
  </header>

  <section class="banner" id="banner">
    <button type="button" class="banner-summary" id="banner-toggle" aria-expanded="false" disabled>
      <div class="banner-summary-text">
        <p class="banner-kicker" id="banner-kicker">No card in flight</p>
        <p class="banner-line" id="banner-line"></p>
        <p class="banner-benefit" id="banner-benefit" hidden></p>
      </div>
      <div class="banner-summary-end">
        <span class="live alert" id="banner-placing" hidden></span>
        <span class="chev" id="banner-chevron" hidden aria-hidden="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7.4 8.6 12 13.2l4.6-4.6 1.4 1.4-6 6-6-6z"/></svg>
        </span>
      </div>
    </button>
    <div class="banner-details" id="banner-details" hidden>
      <p class="effect" id="banner-effect"></p>
      <ul class="tips" id="banner-tips"></ul>
    </div>
  </section>

  <section class="scoreboard" id="scoreboard" hidden>
    <button type="button" class="score-summary" id="score-toggle" aria-expanded="false">
      <span class="score-kicker" id="score-kicker">If the game ended now</span>
      <span class="score-line" id="score-line"></span>
    </button>
    <div class="score-details" id="score-details" hidden>
      <table class="score-break">
        <thead id="score-head"></thead>
        <tbody id="score-lines"></tbody>
      </table>
      <div class="score-cards" id="score-cards" hidden></div>
      <p class="score-note" id="score-note"></p>
      <div class="score-chart-panel" id="score-chart-panel" hidden>
        <button type="button" class="score-chart-toggle" id="score-chart-toggle" aria-expanded="false">
          <span class="score-kicker">Charts</span>
          <span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7.4 8.6 12 13.2l4.6-4.6 1.4 1.4-6 6-6-6z"/></svg></span>
        </button>
        <div class="score-charts" id="score-charts" hidden></div>
      </div>
    </div>
  </section>

  <section class="milestones" id="milestone-panel" hidden>
    <div class="ms-head">
      <div class="ms-rows">
        <div class="ms-block">
          <p class="ms-kicker" id="ms-claimed-kicker">Claimed</p>
          <div class="ms-claimed" id="ms-claimed"></div>
        </div>
        <div class="ms-block" id="award-block" hidden>
          <p class="ms-kicker">Funded</p>
          <div class="ms-claimed" id="ms-awards"></div>
        </div>
      </div>
      <p class="ms-left" id="ms-left"></p>
    </div>
    <div class="ms-grab" id="ms-grab" hidden>
      <p class="ms-kicker ms-grab-kicker">Claim now</p>
      <div class="ms-list" id="ms-grab-list"></div>
    </div>
    <div class="ms-close" id="ms-close" hidden>
      <p class="ms-kicker">One away</p>
      <div class="ms-list" id="ms-close-list"></div>
    </div>
  </section>

  <main class="boards" id="boards"></main>

  <script src="/app.js"></script>
</body>
</html>
